name: detahub
description: DetaHub — Local-first IoT companion app for DetaLab hardware. NO CLOUD. NO LOGIN. YOUR DATA.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Local Database (Drift / SQLite) ---
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # --- Networking ---
  dio: ^5.4.3

  # --- Charting ---
  fl_chart: ^0.68.0

  # --- File & Data Handling ---
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # --- Typography (DetaDesign) ---
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generation ---
  build_runner: ^2.4.10
  drift_dev: ^2.18.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
